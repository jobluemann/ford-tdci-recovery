name: demo-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demo-mode smoke test (simulated ECU)
        run: |
          python ford_recovery.py --demo | tee demo_output.txt
          grep -q "P2453" demo_output.txt
          grep -q "Demo complete" demo_output.txt

      - name: Verify backup snapshot was written
        run: |
          ls backups/*.json
          grep -q '"vin"' backups/*.json
          grep -q '"fault_codes"' backups/*.json

      - name: Run fake-car pipeline test (owner symptom profile)
        run: |
          python demo_fake_car.py | tee fake_car_output.txt
          # module scan must surface the hidden codes
          grep -q "P062F" fake_car_output.txt   # PCM EEPROM fault
          grep -q "P0776" fake_car_output.txt   # TCM / Powershift
          grep -q "P1889" fake_car_output.txt   # DEM / silent AWD failure
          # all four known issues must match the owner's symptoms
          grep -q "DPF differential pressure sensor" fake_car_output.txt
          grep -q "Powershift 6DCT450" fake_car_output.txt
          grep -q "AWD (Haldex-type coupling) pump failure" fake_car_output.txt
          grep -q "PCM loses adaptations" fake_car_output.txt
          grep -q "Four separate known issues" fake_car_output.txt

      - name: Run reflash framework demo (simulated flash)
        run: python pcm_flasher.py --demo | grep -q "demo flash OK"
